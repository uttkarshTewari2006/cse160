<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <canvas id="example" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <br />
    <label>V1 X: <input type="text" id="xInput" value="1.0" /></label>
    <label>V1 Y: <input type="text" id="yInput" value="1.0" /></label>
    <br />
    <label>V2 X: <input type="text" id="x2Input" value="1.0" /></label>
    <label>V2 Y: <input type="text" id="y2Input" value="1.0" /></label>
    <br />
    <button onclick="handleDrawEvent()">Draw</button>
    <br />
    <label>Operation: <select id="operationSelect">
      <option value="add">Add</option>
      <option value="sub">Subtract</option>
      <option value="mul">Multiply</option>
      <option value="div">Divide</option>
      <option value="magnitude">Magnitude</option>
      <option value="normalize">Normalize</option>
      <option value="angle">Angle between</option>
      <option value="area">Area</option>
    </select></label>
    <label>Scalar: <input type="text" id="scalarInput" value="1.0" /></label>
    <button onclick="handleDrawOperationEvent()">Draw Operation</button>
    <script src="lib/lib.js"></script>
    <script src="asgn0.js"></script>
  </body>
</html>
