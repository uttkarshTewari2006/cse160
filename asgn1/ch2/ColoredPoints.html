<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Draw a Square (1)</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            canvas {
                border: 1px solid black;
                display: block;
                margin-bottom: 20px;
            }
            div {
                margin: 10px 0;
            }
            label {
                display: inline-block;
                width: 150px;
            }
            input[type="range"] {
                width: 200px;
                vertical-align: middle;
            }
            button {
                padding: 8px 16px;
                margin-right: 10px;
                cursor: pointer;
            }
            a.button-link {
                display: inline-block;
                padding: 8px 16px;
                margin-right: 10px;
                background-color: #f0f0f0;
                border: 1px solid #ccc;
                border-radius: 4px;
                cursor: pointer;
                text-decoration: none;
                color: #333;
            }
            a.button-link:hover {
                background-color: #e0e0e0;
            }
        </style>
    </head>

    <body onload="main()">
        <canvas id="webgl"
                width="400"
                height="400">
                Please use a browser that supports "canvas"
        </canvas>
        
        <p><em>awesome feature: eraser plus size!</em></p>
        <div>
            <label>Red: 
                <input type="range" id="redSlider" min="0" max="100" value="100">
                <span id="redValue">100</span>%
            </label>
        </div>
        <div>
            <label>Green: 
                <input type="range" id="greenSlider" min="0" max="100" value="0">
                <span id="greenValue">0</span>%
            </label>
        </div>
        <div>
            <label>Blue: 
                <input type="range" id="blueSlider" min="0" max="100" value="0">
                <span id="blueValue">0</span>%
            </label>
        </div>
        
        <div>
            <strong>Drawing Mode:</strong><br>
            <button id="pointButton">Squares</button>
            <button id="triangleButton">Triangles</button>
            <button id="circleButton">Circles</button>
            <button id="eraserButton">Eraser</button>
        </div>
        
        <button id="drawUTButton">Draw UT Art</button>
        <button id="clearButton">Clear Canvas</button>
        <a href="../assets/IMG_6963.jpeg" class="button-link">View Drawing</a>
        
        <div>
            <label>Shape Size: 
                <input type="range" id="sizeSlider" min="0.02" max="0.3" step="0.01" value="0.1">
                <span id="sizeValue">0.1</span>
            </label>
        </div>
        
        <div>
            <label>Eraser Size: 
                <input type="range" id="eraserSlider" min="0.02" max="0.3" step="0.01" value="0.1">
                <span id="eraserValue">0.1</span>
            </label>
        </div>
        
        <div>
            <label>Circle Segments: 
                <input type="range" id="segmentSlider" min="3" max="60" value="10">
                <span id="segmentValue">10</span>
            </label>
        </div>

        
        <script src="../lib/webgl-utils.js"></script>
        <script src="../lib/webgl-debug.js"></script>
        <script src="../lib/cuon-utils.js"></script>
        <script src="Point.js"></script>
        <script src="Triangle.js"></script>
        <script src="Circle.js"></script>
        <script src="ColoredPoints.js"></script>
    </body>
</html>
